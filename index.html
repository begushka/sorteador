<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Separa assunto</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Sorteador de tópicos</h1>
        <p>Tentativas: {{ tentativas }}/3</p>
        <form action="/sortear" method="POST">
            <button type="submit">
                Trocar assunto
            </button>
        </form>
        {% if resultados %}
            <h2>Resultado:</h2>
            {% for resultado in resultados %}
                <p>
                    {{ resultado.pessoa }} ficou com:
                    <strong>{{ resultado.topico }}</strong>
                </p>
            {% endfor %}
        {% endif %}
        {% if erro %}
            <h3 style="color: red;">
                {{ erro }}
            </h3>
        {% endif %}
    </body>
</html>
